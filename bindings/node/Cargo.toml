[package]
name = "wyc-node-pilot"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
wyc-binding-contract = { path = "../ffi" }
napi = { version = "=2.16.17", default-features = false, features = ["napi8"] }
napi-derive = "=2.16.13"

[build-dependencies]
napi-build = "=2.1.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
