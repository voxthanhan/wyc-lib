[build-system]
requires = ["maturin==1.8.3"]
build-backend = "maturin"

[project]
name = "wyc-lib"
version = "0.1.0"
description = "P1 Rust analytical API with owned Python and dataframe adapters; pre-Foundation"
requires-python = ">=3.10,<3.11"

[project.optional-dependencies]
numpy = ["numpy==2.2.6"]
pandas = ["numpy==2.2.6", "pandas==2.2.3"]
polars = ["polars==1.30.0"]

[tool.maturin]
module-name = "wyc_lib._native"
python-source = "python"
