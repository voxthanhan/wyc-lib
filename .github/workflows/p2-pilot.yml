name: P2.1 native pilot

on:
  push:
    branches: [main, work/p2-1-ffi-pilot]
  workflow_dispatch:
    inputs:
      bootstrap_native_locks:
        description: 'Initial lock resolution only; not locked-source acceptance'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-pilot:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'
      - name: Install pinned build tool
        run: python -m pip install maturin==1.8.3
      - name: Check Core and shared transport
        shell: pwsh
        run: ./scripts/check-foundation.ps1 -RequireClean -ExpectedCommit '${{ github.sha }}'
      - name: Build and test installed native packages
        shell: pwsh
        env:
          BOOTSTRAP_NATIVE_LOCKS: ${{ inputs.bootstrap_native_locks }}
        run: |
          $options = @()
          if ($env:BOOTSTRAP_NATIVE_LOCKS -eq 'true' -or
              !(Test-Path bindings/node/Cargo.lock) -or
              !(Test-Path bindings/python/Cargo.lock)) {
            $options += '--bootstrap-native-locks'
          }
          python scripts/check_p2.py @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-pilot-${{ matrix.os }}-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error
