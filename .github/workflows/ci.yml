name: Rust foundation

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  foundation:
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check foundation and record evidence
        shell: pwsh
        run: |
          ./scripts/check-foundation.ps1 -RequireClean -ExpectedCommit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-${{ matrix.os }}-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error
